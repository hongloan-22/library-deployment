services:
  db:
    image: mysql:8.4
    container_name: library-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - proxy_net

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: library-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - admin_net

  nginx:
    image: nginx:stable-alpine
    container_name: library-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - proxy_net
      - monitoring_net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: library-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: library-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      - proxy_net
      - monitoring_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: library-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --config.my-cnf=/.my.cnf
    volumes:
      - ./monitoring/mysql-exporter.my.cnf:/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net

  loki:
    image: grafana/loki:3.6.7
    container_name: library-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:3.6.7
    container_name: library-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: library-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - nginx-exporter
      - mysqld-exporter
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:13.2.2
    container_name: library-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  backend_net:
    internal: true

  proxy_net:
    driver: bridge

  monitoring_net:
    driver: bridge

  admin_net:
    driver: bridge